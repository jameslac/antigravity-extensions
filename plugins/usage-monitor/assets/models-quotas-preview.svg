<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560">
  <defs>
    <style>
      .bg { fill: #0f1115; }
      .card { fill: #171a21; stroke: rgba(148, 163, 184, 0.2); stroke-width: 1; }
      .surface2 { fill: #21252f; }
      .line { stroke: rgba(148, 163, 184, 0.18); stroke-width: 1; }
      .fg { fill: #eceef2; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .muted { fill: #9aa3b2; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .accent { fill: #6366f1; }
      .good { fill: #10b981; }
      .warn { fill: #f59e0b; }
      .danger { fill: #ef4444; }
      .info { fill: #38bdf8; }
      .title { font-size: 14px; font-weight: 600; }
      .sec { font-size: 11px; font-weight: 600; letter-spacing: 0.6px; }
      .card-title { font-size: 13px; font-weight: 600; }
      .sm { font-size: 11px; }
      .xs { font-size: 10px; }
      .kpi-val { font-size: 19px; font-weight: 700; }
    </style>
  </defs>

  <!-- Outer window -->
  <rect class="bg" x="0" y="0" width="880" height="560" rx="12"/>
  <rect x="0.5" y="0.5" width="879" height="559" rx="12" fill="none" stroke="rgba(148, 163, 184, 0.22)"/>

  <!-- Topbar -->
  <g transform="translate(18, 16)">
    <!-- Logo -->
    <rect x="0" y="2" width="18" height="18" rx="4" fill="none" stroke="#6366f1" stroke-width="1.8"/>
    <path d="M5 15V10 M9 15V6 M13 15V8" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
    <text class="fg title" x="26" y="16">Model &amp; Token Usage</text>

    <!-- Live pill + refresh -->
    <rect class="surface2" x="760" y="0" width="52" height="22" rx="11"/>
    <circle class="good" cx="772" cy="11" r="3.5"/>
    <text class="muted sm" x="780" y="15">Live</text>
    <rect x="818" y="0" width="26" height="22" rx="6" fill="none" stroke="rgba(148,163,184,0.22)"/>
    <path d="M835 11a4.5 4.5 0 1 1-1.2-3M835 6.5v2.4h-2.4" fill="none" stroke="#9aa3b2" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Mode tabs -->
    <text class="fg sm" font-weight="600" x="0" y="42">Models &amp; Quotas</text>
    <rect class="accent" x="0" y="48" width="96" height="2" rx="1"/>
    <text class="muted sm" x="116" y="42">Context &amp; Tokens</text>
    <line class="line" x1="-18" y1="50" x2="862" y2="50"/>
  </g>

  <!-- Section: Model Quotas -->
  <text class="muted sec" x="18" y="88">MODEL QUOTAS</text>
  <text class="muted xs" x="795" y="88">Updated just now</text>

  <!-- Quota Card 1: Gemini Models -->
  <g transform="translate(18, 98)">
    <rect class="card" x="0" y="0" width="272" height="132" rx="10"/>
    <text class="fg card-title" x="14" y="24">Gemini Models</text>
    <text class="muted xs" x="14" y="40">Gemini 4 Hydrogen, Gemini 3.8 Flash</text>

    <text class="fg sm" x="14" y="62">Weekly Limit Remaining</text>
    <text class="fg sm" font-weight="600" x="220" y="62">72.9%</text>
    <rect class="surface2" x="14" y="68" width="244" height="7" rx="3.5"/>
    <rect class="good" x="14" y="68" width="178" height="7" rx="3.5"/>
    <text class="muted xs" x="14" y="86">weekly window</text>
    <text class="muted xs" x="174" y="86">Resets in 3d 16h</text>

    <text class="fg sm" x="14" y="106">Five Hour Limit Remaining</text>
    <text class="fg sm" font-weight="600" x="220" y="106">89.4%</text>
    <rect class="surface2" x="14" y="112" width="244" height="7" rx="3.5"/>
    <rect class="good" x="14" y="112" width="218" height="7" rx="3.5"/>
  </g>

  <!-- Quota Card 2: Claude and GPT -->
  <g transform="translate(304, 98)">
    <rect class="card" x="0" y="0" width="272" height="132" rx="10"/>
    <text class="fg card-title" x="14" y="24">Claude and GPT models</text>
    <text class="muted xs" x="14" y="40">Claude Opus 5.5, Sonnet 5.5, GPT-OSS</text>

    <text class="fg sm" x="14" y="62">Weekly Limit Remaining</text>
    <text class="fg sm" font-weight="600" x="220" y="62">41.2%</text>
    <rect class="surface2" x="14" y="68" width="244" height="7" rx="3.5"/>
    <rect class="warn" x="14" y="68" width="100" height="7" rx="3.5"/>
    <text class="muted xs" x="14" y="86">weekly window</text>
    <text class="muted xs" x="174" y="86">Resets in 1d 3h</text>

    <text class="fg sm" x="14" y="106">Five Hour Limit Remaining</text>
    <text class="fg sm" font-weight="600" x="220" y="106">100.0%</text>
    <rect class="surface2" x="14" y="112" width="244" height="7" rx="3.5"/>
    <rect class="good" x="14" y="112" width="244" height="7" rx="3.5"/>
  </g>

  <!-- Quota Card 3: Gemini 4 Argon -->
  <g transform="translate(590, 98)">
    <rect class="card" x="0" y="0" width="272" height="132" rx="10"/>
    <text class="fg card-title" x="14" y="24">Gemini 4 Argon</text>
    <text class="muted xs" x="14" y="40">Dedicated Argon weekly capacity pool</text>

    <text class="fg sm" x="14" y="62">Argon Weekly Limit</text>
    <text class="fg sm" font-weight="600" x="220" y="62">64.5%</text>
    <rect class="surface2" x="14" y="68" width="244" height="7" rx="3.5"/>
    <rect class="good" x="14" y="68" width="157" height="7" rx="3.5"/>
    <text class="muted xs" x="14" y="86">weekly window</text>
    <text class="muted xs" x="174" y="86">Resets in 3d 16h</text>

    <text class="muted xs" x="14" y="114">Pro/Ultra tier per-model quota active</text>
  </g>

  <!-- Section: Token Usage Summary -->
  <text class="muted sec" x="18" y="256">TOKEN USAGE SUMMARY</text>
  <g transform="translate(722, 240)">
    <rect class="surface2" x="0" y="0" width="140" height="24" rx="7"/>
    <rect class="card" x="2" y="2" width="60" height="20" rx="5"/>
    <text class="fg xs" font-weight="600" x="12" y="15">All Time</text>
    <text class="muted xs" x="76" y="15">7d</text>
    <text class="muted xs" x="110" y="15">24h</text>
  </g>

  <!-- KPI Cards -->
  <g transform="translate(18, 272)">
    <rect class="card" x="0" y="0" width="204" height="68" rx="10"/>
    <text class="muted xs" x="14" y="20">Total Tokens</text>
    <text class="fg kpi-val" x="14" y="44">198.44M</text>
    <text class="muted xs" x="14" y="59">1,665 turns · 21 chats</text>

    <rect class="card" x="214" y="0" width="204" height="68" rx="10"/>
    <text class="muted xs" x="228" y="20">Uncached Input</text>
    <text class="fg kpi-val" x="228" y="44">18.58M</text>
    <text class="muted xs" x="228" y="59">Cache read: 178.52M</text>

    <rect class="card" x="428" y="0" width="204" height="68" rx="10"/>
    <text class="muted xs" x="442" y="20">Cache Hit Rate</text>
    <text class="fg kpi-val" x="442" y="44">90.6%</text>
    <text class="muted xs" x="442" y="59">178.52M cached prefix</text>

    <rect class="card" x="642" y="0" width="202" height="68" rx="10"/>
    <text class="muted xs" x="656" y="20">Output Tokens</text>
    <text class="fg kpi-val" x="656" y="44">1.34M</text>
    <text class="muted xs" x="656" y="59">Think: 518K · Resp: 822K</text>
  </g>

  <!-- Section: Usage by Model -->
  <text class="muted sec" x="18" y="366">USAGE BY MODEL</text>
  <text class="muted xs" x="822" y="366">4 shown</text>

  <g transform="translate(18, 376)">
    <rect class="card" x="0" y="0" width="844" height="168" rx="10"/>

    <!-- Row 1 -->
    <text class="fg card-title" x="14" y="24">Gemini 4 Hydrogen (Orchestrator)</text>
    <rect x="650" y="10" width="70" height="18" rx="9" fill="rgba(16,185,129,0.16)"/>
    <text class="good xs" font-weight="600" x="660" y="23">99% quota</text>
    <rect x="728" y="10" width="102" height="18" rx="9" fill="rgba(99,102,241,0.18)"/>
    <text class="fg xs" font-weight="600" x="738" y="23">97.2M (49.0%)</text>
    <rect class="surface2" x="14" y="34" width="816" height="6" rx="3"/>
    <rect class="accent" x="14" y="34" width="748" height="6" rx="3"/>
    <rect class="info" x="762" y="34" width="56" height="6"/>
    <rect class="good" x="818" y="34" width="12" height="6" rx="3"/>
    <text class="muted xs" x="14" y="54">520 turns  ·  12 chats  ·  In 6.9M  ·  Cache 89.8M (92.9%)  ·  Out 488K  ·  Think 195K</text>
    <line class="line" x1="0" y1="66" x2="844" y2="66"/>

    <!-- Row 2 -->
    <text class="fg card-title" x="14" y="88">Gemini 4 Argon (Medium)</text>
    <rect x="650" y="74" width="70" height="18" rx="9" fill="rgba(16,185,129,0.16)"/>
    <text class="good xs" font-weight="600" x="660" y="87">99% quota</text>
    <rect x="728" y="74" width="102" height="18" rx="9" fill="rgba(99,102,241,0.18)"/>
    <text class="fg xs" font-weight="600" x="738" y="87">40.9M (20.6%)</text>
    <rect class="surface2" x="14" y="98" width="816" height="6" rx="3"/>
    <rect class="accent" x="14" y="98" width="712" height="6" rx="3"/>
    <rect class="info" x="726" y="98" width="86" height="6"/>
    <rect class="good" x="812" y="98" width="18" height="6" rx="3"/>
    <text class="muted xs" x="14" y="118">548 turns  ·  9 chats  ·  In 4.4M  ·  Cache 36.1M (89.0%)  ·  Out 380K  ·  Think 172K</text>
    <line class="line" x1="0" y1="130" x2="844" y2="130"/>

    <!-- Row 3 -->
    <text class="fg card-title" x="14" y="152">Claude Sonnet 5.5 (Medium)</text>
    <rect x="650" y="138" width="70" height="18" rx="9" fill="rgba(245,158,11,0.16)"/>
    <text class="warn xs" font-weight="600" x="660" y="151">41% quota</text>
    <rect x="728" y="138" width="102" height="18" rx="9" fill="rgba(99,102,241,0.18)"/>
    <text class="fg xs" font-weight="600" x="742" y="151">9.5M (4.8%)</text>
  </g>
</svg>
