<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 640" width="460" height="640">
  <defs>
    <style>
      .bg { fill: #0f1115; }
      .card { fill: #171a21; stroke: rgba(148, 163, 184, 0.2); stroke-width: 1; }
      .surface2 { fill: #21252f; }
      .line { stroke: rgba(148, 163, 184, 0.18); stroke-width: 1; }
      .fg { fill: #eceef2; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .muted { fill: #9aa3b2; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .accent { fill: #6366f1; }
      .good { fill: #10b981; }
      .info { fill: #38bdf8; }
      .title { font-size: 14px; font-weight: 600; }
      .sec { font-size: 11px; font-weight: 600; letter-spacing: 0.6px; }
      .card-title { font-size: 13px; font-weight: 600; }
      .sm { font-size: 11px; }
      .xs { font-size: 10px; }
      .kpi-val { font-size: 18px; font-weight: 700; }
    </style>
  </defs>

  <!-- Outer window -->
  <rect class="bg" x="0" y="0" width="460" height="640" rx="12"/>
  <rect x="0.5" y="0.5" width="459" height="639" rx="12" fill="none" stroke="rgba(148, 163, 184, 0.22)"/>

  <!-- Topbar -->
  <g transform="translate(14, 14)">
    <rect x="0" y="2" width="18" height="18" rx="4" fill="none" stroke="#6366f1" stroke-width="1.8"/>
    <path d="M5 15V10 M9 15V6 M13 15V8" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
    <text class="fg title" x="26" y="16">Model &amp; Token Usage</text>

    <rect class="surface2" x="348" y="0" width="52" height="22" rx="11"/>
    <circle class="good" cx="360" cy="11" r="3.5"/>
    <text class="muted sm" x="368" y="15">Live</text>
    <rect x="406" y="0" width="26" height="22" rx="6" fill="none" stroke="rgba(148,163,184,0.22)"/>
    <path d="M423 11a4.5 4.5 0 1 1-1.2-3M423 6.5v2.4h-2.4" fill="none" stroke="#9aa3b2" stroke-width="1.4" stroke-linecap="round"/>

    <text class="muted sm" x="0" y="42">Models &amp; Quotas</text>
    <text class="fg sm" font-weight="600" x="112" y="42">Context &amp; Tokens</text>
    <rect class="accent" x="112" y="48" width="96" height="2" rx="1"/>
    <line class="line" x1="-14" y1="50" x2="446" y2="50"/>
  </g>

  <!-- Conversation selector header -->
  <g transform="translate(14, 76)">
    <rect class="card" x="0" y="0" width="432" height="68" rx="10"/>
    <rect class="bg" x="10" y="10" width="302" height="26" rx="6" stroke="rgba(148,163,184,0.22)"/>
    <text class="fg sm" x="18" y="27">Implement Usage Monitor Sidecar</text>
    <path d="M296 20l4 4 4-4" fill="none" stroke="#9aa3b2" stroke-width="1.5" stroke-linecap="round"/>

    <rect x="322" y="16" width="13" height="13" rx="3" fill="#6366f1"/>
    <path d="M325 22.5l2.5 2.5 4.5-4.5" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
    <text class="muted xs" x="340" y="26">Follow open chat</text>

    <rect x="10" y="44" width="48" height="16" rx="8" fill="rgba(16,185,129,0.16)"/>
    <text class="good xs" font-weight="600" x="19" y="55">Active</text>
    <rect x="64" y="44" width="174" height="16" rx="8" fill="rgba(99,102,241,0.18)"/>
    <text class="fg xs" x="72" y="55">Gemini 4 Hydrogen (Orchestrator)</text>
    <rect class="surface2" x="244" y="44" width="100" height="16" rx="8"/>
    <text class="muted xs" x="253" y="55">66 turns · 142 steps</text>
  </g>

  <!-- Context Window Card -->
  <g transform="translate(14, 154)">
    <rect class="card" x="0" y="0" width="432" height="190" rx="10"/>
    <text class="muted sec" x="12" y="20">CONTEXT WINDOW</text>
    <text class="fg" font-size="16" font-weight="700" x="12" y="42">282.6K / 512.0K tokens</text>
    <rect class="surface2" x="366" y="16" width="54" height="24" rx="12"/>
    <text class="fg sm" font-weight="700" x="376" y="32">55.2%</text>

    <!-- Segmented bar -->
    <rect class="surface2" x="12" y="54" width="408" height="10" rx="5"/>
    <rect class="accent" x="12" y="54" width="218" height="10" rx="5"/>
    <rect class="info" x="226" y="54" width="12" height="10"/>

    <!-- Legend -->
    <rect class="accent" x="12" y="74" width="8" height="8" rx="2"/>
    <text class="muted xs" x="25" y="82">Cached: <tspan class="fg" font-weight="600">238.4K</tspan></text>
    <rect class="info" x="126" y="74" width="8" height="8" rx="2"/>
    <text class="muted xs" x="139" y="82">New Input: <tspan class="fg" font-weight="600">6.1K</tspan></text>
    <text class="muted xs" x="258" y="82">Remaining: <tspan class="fg" font-weight="600">229.4K</tspan></text>

    <line class="line" x1="12" y1="96" x2="420" y2="96"/>

    <!-- Expanded breakdown -->
    <text class="fg sm" font-weight="600" x="12" y="114">▾ System Prompt</text>
    <text class="muted xs" x="358" y="114">16.3K (5.8%)</text>
    <line class="line" x1="18" y1="122" x2="18" y2="152"/>
    <text class="muted xs" x="26" y="132">skills</text>
    <text class="muted xs" x="394" y="132">4.5K</text>
    <text class="muted xs" x="26" y="148">subagents</text>
    <text class="muted xs" x="394" y="148">2.8K</text>

    <text class="fg sm" font-weight="600" x="12" y="166">▸ Tools</text>
    <text class="muted xs" x="362" y="166">9.7K (3.4%)</text>
    <text class="fg sm" font-weight="600" x="12" y="182">▸ Chat Messages</text>
    <text class="muted xs" x="348" y="182">256.6K (90.8%)</text>
  </g>

  <!-- 2x2 KPI Grid -->
  <g transform="translate(14, 354)">
    <rect class="card" x="0" y="0" width="211" height="64" rx="10"/>
    <text class="muted xs" x="12" y="18">Total Tokens</text>
    <text class="fg kpi-val" x="12" y="40">9.51M</text>
    <text class="muted xs" x="12" y="55">Uncached In: 918K</text>

    <rect class="card" x="221" y="0" width="211" height="64" rx="10"/>
    <text class="muted xs" x="233" y="18">Cache Hit Rate</text>
    <text class="fg kpi-val" x="233" y="40">90.3%</text>
    <text class="muted xs" x="233" y="55">Read: 8.51M</text>

    <rect class="card" x="0" y="72" width="211" height="64" rx="10"/>
    <text class="muted xs" x="12" y="90">Output Tokens</text>
    <text class="fg kpi-val" x="12" y="112">78.1K</text>
    <text class="muted xs" x="12" y="127">Think: 25.6K · Resp: 52.5K</text>

    <rect class="card" x="221" y="72" width="211" height="64" rx="10"/>
    <text class="muted xs" x="233" y="90">Avg TTFT &amp; Stream</text>
    <text class="fg kpi-val" x="233" y="112">2.4s</text>
    <text class="muted xs" x="233" y="127">Stream: 2m 18s</text>
  </g>

  <!-- Turn-by-Turn Timeline -->
  <text class="muted sec" x="14" y="512">TURN-BY-TURN TIMELINE</text>
  <rect x="356" y="498" width="90" height="20" rx="5" fill="none" stroke="rgba(148,163,184,0.22)"/>
  <text class="muted xs" x="370" y="512">Newest first</text>

  <g transform="translate(14, 524)">
    <rect class="card" x="0" y="0" width="432" height="102" rx="10"/>
    <!-- Sparkline bars -->
    <g transform="translate(14, 14)">
      <rect class="accent" x="0" y="42" width="12" height="14" rx="2"/>
      <rect class="accent" x="16" y="38" width="12" height="18" rx="2"/>
      <rect class="accent" x="32" y="35" width="12" height="21" rx="2"/>
      <rect class="accent" x="48" y="31" width="12" height="25" rx="2"/>
      <rect class="accent" x="64" y="29" width="12" height="27" rx="2"/>
      <rect class="accent" x="80" y="26" width="12" height="30" rx="2"/>
      <rect class="accent" x="96" y="24" width="12" height="32" rx="2"/>
      <rect class="accent" x="112" y="22" width="12" height="34" rx="2"/>
      <rect class="accent" x="128" y="20" width="12" height="36" rx="2"/>
      <rect class="accent" x="144" y="18" width="12" height="38" rx="2"/>
      <rect class="accent" x="160" y="15" width="12" height="41" rx="2"/>
      <rect class="accent" x="176" y="14" width="12" height="42" rx="2"/>
      <rect class="accent" x="192" y="12" width="12" height="44" rx="2"/>
      <rect class="accent" x="208" y="10" width="12" height="46" rx="2"/>
      <rect class="accent" x="224" y="8" width="12" height="48" rx="2"/>
      <rect class="accent" x="240" y="6" width="12" height="50" rx="2"/>
      <rect class="accent" x="256" y="5" width="12" height="51" rx="2"/>
      <rect class="accent" x="272" y="4" width="12" height="52" rx="2"/>
      <rect class="accent" x="288" y="3" width="12" height="53" rx="2"/>
      <rect class="accent" x="304" y="2" width="12" height="54" rx="2"/>
      <rect class="accent" x="320" y="2" width="12" height="54" rx="2"/>
      <rect class="accent" x="336" y="1" width="12" height="55" rx="2"/>
      <rect class="accent" x="352" y="1" width="12" height="55" rx="2"/>
      <rect class="accent" x="368" y="0" width="12" height="56" rx="2"/>
      <rect class="info" x="384" y="0" width="12" height="8" rx="2"/>
      <rect class="accent" x="384" y="8" width="12" height="48" rx="2"/>
    </g>
    <text class="muted xs" x="14" y="88">Turn 42 → Turn 66</text>
    <text class="muted xs" x="352" y="88">Peak: 284K</text>
  </g>
</svg>
